apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
  namespace: envoy-gateway-system
spec:
  interval: 30m
  type: "oci"
  url: oci://docker.io/envoyproxy

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-helm
  namespace: envoy-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "v1.5.1"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
      interval: 1m
