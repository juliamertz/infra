# apiVersion: source.toolkit.fluxcd.io/v1
# kind: HelmRepository
# metadata:
#   name: minio
# spec:
#   interval: 30m
#   url: https://helm.min.io/

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minio
  namespace: minio
spec:
  interval: 30m
  type: "oci"
  url: oci://registry-1.docker.io/bitnamicharts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  interval: 5m
  chart:
    spec:
      chart: minio
      version: "17.0.21"
      sourceRef:
        kind: HelmRepository
        name: minio
      interval: 1m
  values:
    mode: standalone
    defaultBuckets: "helm-charts"
    tls:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
      storageClass: hcloud-volumes
