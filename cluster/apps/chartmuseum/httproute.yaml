apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chartmusuem
spec:
  parentRefs:
  - name: shared
    namespace: default
  hostnames:
  - charts.juliamertz.dev
  rules:
  - backendRefs:
    - name: chartmuseum
      port: 8080

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: chartmuseum
spec:
  targetCertificate:
    name: gateway-tls
    namespace: default
  hostnames:
    - charts.juliamertz.dev


