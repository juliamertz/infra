apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: chartmuseum
spec:
  interval: 30m
  url: https://chartmuseum.github.io/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chartmuseum
spec:
  interval: 5m
  chart:
    spec:
      chart: chartmuseum
      version: "3.10.4"
      sourceRef:
        kind: HelmRepository
        name: chartmuseum
      interval: 1m
  values:
    replicaCount: 2

    env:
      open:
        STORAGE: amazon
        STORAGE_AMAZON_BUCKET: helm-charts
        STORAGE_AMAZON_REGION: us-east-1
        STORAGE_AMAZON_ENDPOINT: http://minio.minio.svc.cluster.local:9000
        STORAGE_AMAZON_PREFIX: ""
        DISABLE_STATEFILES: true
        DISABLE_API: true
        ALLOW_OVERWRITE: true
        DELETE: true
        CHART_URL: ""
        DEPTH: 0
      existingSecret: chartmuseum-storage-credentials
      existingSecretMappings:
        AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 20m
        memory: 128Mi

    persistence:
      enabled: false


