apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
spec:
  interval: 30m
  url: https://charts.jetstack.io

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 1m
  values:
    crds:
      enabled: true
    global:
      leaderElection:
        namespace: cert-manager
    resources:
      requests:
        cpu: 50m
        memory: 100M
      limits:
        cpu: 50m
        memory: 100M
    cainjector:
      resources:
        requests:
          cpu: 50m
          memory: 80M
        limits:
          cpu: 100m
          memory: 100M
    webhook:
      resources:
        requests:
          cpu: 50m
          memory: 50M
        limits:
          cpu: 100m
          memory: 100M
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
