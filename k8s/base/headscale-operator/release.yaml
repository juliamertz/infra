kind: HelmRelease
metadata:
  name: headscale-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: headscale-operator
      version: 0.0.2
      sourceRef:
        kind: HelmRepository
        name: headscale-operator
      interval: 5m
  values:
    crds:
      install: false
