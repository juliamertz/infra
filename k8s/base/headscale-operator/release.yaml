apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: juliamertz
spec:
  interval: 30m
  url: https://charts.juliamertz.dev

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: headscale-operator
      version: v0.0.1
      sourceRef:
        kind: HelmRepository
        name: juliamertz
      interval: 1m
  values: {}
