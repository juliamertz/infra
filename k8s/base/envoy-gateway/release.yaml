apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
  namespace: envoy-gateway-system
spec:
  interval: 30m
  type: "oci"
  url: oci://docker.io/envoyproxy

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-helm
  namespace: envoy-gateway-system
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "1.6.3"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
      interval: 1m
  values:
    deployment:
      replicas: 3
    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableBackend: true
        rateLimit:
          backend:
            type: Redis
            redis:
              url: envoy-ratelimit-db.envoy-gateway-system.svc.cluster.local:6379
