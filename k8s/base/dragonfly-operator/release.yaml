apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dragonfly
  namespace: dragonfly-operator
spec:
  interval: 30m
  type: "oci"
  url: oci://ghcr.io/dragonflydb/dragonfly-operator/helm

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
  namespace: dragonfly-operator
spec:
  interval: 5m
  chart:
    spec:
      chart: dragonfly-operator
      version: v1.3.1
      sourceRef:
        kind: HelmRepository
        name: dragonfly
      interval: 1m
  values:
    crds:
      install: true

    podSecurityContext:
      fsGroup: 2000

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000

    serviceMonitor:
      enabled: true

    prometheusRule:
      enabled: true
      spec:
        - alert: DragonflyMissing
          expr: absent(dragonfly_uptime_in_seconds) == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: Dragonfly is missing
            description: "Dragonfly is missing"
