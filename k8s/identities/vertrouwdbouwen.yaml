---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-service-account
  namespace: vertrouwd-bouwen

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: vertrouwd-bouwen
rules:
- apiGroups: ["apps", ""]
  resources: ["deployments", "services", "configmaps", "secrets", "pods"]
  verbs: ["*"]
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["*"]
- apiGroups: ["cert-vandal.io"]
  resources: ["saninjections"]
  verbs: ["*"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["*"]
# Pod debugging                                                                      
- apiGroups: [""]                
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"] 
# Execute commands in pods (for interactive debugging)                               
- apiGroups: [""]                       
  resources: ["pods/exec"]                                                           
  verbs: ["create", "get"]        
# Port forwarding (for local debugging)                                              
- apiGroups: [""]                  
  resources: ["pods/portforward"]              
  verbs: ["create", "get"]                          
# Deployments (restart, rollout status) 
- apiGroups: ["apps"]                                                                
  resources: ["deployments", "deployments/status", "replicasets"]                    
  verbs: ["get", "list", "watch", "patch"]
# Services and endpoints                                                                                                                                                      
- apiGroups: [""]              
  resources: ["services", "endpoints"]                                                                                                                                        
  verbs: ["get", "list", "watch"]                                                    
# ConfigMaps and Secrets (view config, not recommended for secrets in prod)                                                                                                                                
- apiGroups: [""]                       
  resources: ["configmaps"]                                                                                                                                                                                
  verbs: ["get", "list"]                
# Events (useful for debugging pod failures)                                         
- apiGroups: [""]                       
  resources: ["events"]                             
  verbs: ["get", "list", "watch"]                                                                                                                                                                                             
# HTTPRoutes (Gateway API)                                                                                                                                                                                                    
- apiGroups: ["gateway.networking.k8s.io"]          
  resources: ["httproutes"]                                                                                                                                                                                                   
  verbs: ["get", "list", "watch"]                   
# Metrics (resource usage)                          
- apiGroups: ["metrics.k8s.io"]                     
  resources: ["pods", "nodes"]                      
  verbs: ["get", "list"]                            

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-sa-binding
  namespace: vertrouwd-bouwen
subjects:
- kind: ServiceAccount
  name: deploy-service-account
  namespace: vertrouwd-bouwen
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io

