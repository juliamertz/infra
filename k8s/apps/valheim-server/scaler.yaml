apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: valheim-server-scaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: valheim-server
  minReplicaCount: 0
  maxReplicaCount: 1
  idleReplicaCount: 0
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 3600
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: active_players
        query: max_over_time(sum(valheim_players_online)[1h:])
        threshold: "1"
