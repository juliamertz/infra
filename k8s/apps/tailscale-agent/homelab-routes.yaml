apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-route-proxy
  namespace: tailscale-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-route-proxy
  template:
    metadata:
      labels:
        app: homelab-route-proxy
      annotations:
        headscale.juliamertz.dev/tailscale-inject-sidecar: "true"
        headscale.juliamertz.dev/tailscale-extra-args: --login-server https://headscale.juliamertz.nl:30443 --accept-routes 
        # --advertise-tags=tag:tailscale-sidecar
        headscale.juliamertz.dev/tailscale-auth-secret: tailscale-agent-auth
    spec:
      containers:
      - name: caddy
        image: caddy:latest
        command: ["sh", "-c"]
        args:
        - |
          cat <<'EOF' > /etc/caddy/Caddyfile
          {
              auto_https off
              servers {
                  timeouts {
                      read_body 0
                      read_header 30s
                      write 0
                      idle 5m
                  }
              }
          }

          http://hass.juliamertz.dev, http://hass.juliamertz.nl {
              reverse_proxy http://hydra.headscale.local:8123 {
                  header_up Host {host}
                  header_up X-Real-IP {remote_host}
                  header_up X-Forwarded-For {remote_host}
                  header_up X-Forwarded-Proto {scheme}
              }
          }

          http://watch.juliamertz.dev, http://watch.juliamertz.nl {
              request_body {
                  max_size 0
              }
              reverse_proxy http://hydra.headscale.local:8096 {
                  transport http {
                      response_header_timeout 0
                      read_timeout 0
                      write_timeout 0
                  }
                  flush_interval -1
                  header_up Host {host}
                  header_up X-Real-IP {remote_host}
                  header_up X-Forwarded-For {remote_host}
                  header_up X-Forwarded-Proto {scheme}
              }
          }
          EOF
          caddy run --config /etc/caddy/Caddyfile
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: homelab-route-proxy
  namespace: tailscale-agent
spec:
  type: ClusterIP
  selector:
    app: homelab-route-proxy
  ports:
    - name: http
      port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelab-route-proxy
  namespace: tailscale-agent
spec:
  hostnames:
    - hass.juliamertz.dev
    - hass.juliamertz.nl
    - watch.juliamertz.dev
    - watch.juliamertz.nl
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: default
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: homelab-route-proxy
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: homelab-route-proxy
  namespace: tailscale-agent
spec:
  hostnames:
    - hass.juliamertz.dev
    - hass.juliamertz.nl
    - watch.juliamertz.dev
    - watch.juliamertz.nl
  targetCertificate:
    name: gateway-tls
    namespace: default

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: homelab-route-proxy-auth
  namespace: tailscale-agent
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: homelab-route-proxy
  extAuth:
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
    failOpen: false
    http:
      backendRefs:
        - name: authelia
          namespace: authelia
          port: 80
      path: /api/authz/ext-authz/
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
