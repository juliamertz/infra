apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  url: https://charts.authelia.com

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 1h
  chart:
    spec:
      chart: authelia
      version: 0.10.49
      sourceRef:
        kind: HelmRepository
        name: authelia
  values:
    pod:
      kind: Deployment
      replicas: 2
      extraVolumeMounts:
        - name: users-db
          mountPath: /config/users.yml
          subPath: USERS_DATABASE
      extraVolumes:
        - name: users-db
          secret:
            secretName: authelia-secrets
            items:
              - key: USERS_DATABASE
                path: USERS_DATABASE

    configMap:
      theme: dark
      
      log:
        level: debug

      default_2fa_method: totp

      server:
        endpoints:
          authz:
            ext-authz:
              implementation: ExtAuthz
              authn_strategies:
                - name: CookieSession
            # forward-auth:
            #   implementation: ForwardAuth
            #   authn_strategies:
            #     - name: CookieSession

      authentication_backend:
        file:
          enabled: true
          path: /config/users.yml

      session:
        name: authelia_session
        same_site: lax
        inactivity: 5m
        expiration: 1h
        remember_me: 1M
        cookies:
          - domain: juliamertz.dev
            subdomain: auth
            authelia_url: https://auth.juliamertz.dev
            default_redirection_url: https://hass.juliamertz.dev
          - domain: merlijnvoncken.nl
            subdomain: auth
            authelia_url: https://auth.merlijnvoncken.nl
            default_redirection_url: https://admin.merlijnvoncken.nl
            name: authelia_session_nl
          - domain: merlijnvoncken.com
            subdomain: auth
            authelia_url: https://auth.merlijnvoncken.com
            default_redirection_url: https://admin.merlijnvoncken.com
        redis:
          enabled: true
          host: authelia-cache.authelia.svc.cluster.local
          port: 6379

      storage:
        postgres:
          enabled: true
          address: tcp://authelia-db-rw.authelia.svc.cluster.local:5432
          database: authelia
          username: authelia
          password:
            disabled: false
            secret_name: authelia-db-app
            path: password

      access_control:
        default_policy: one_factor
        rules:
          - domain: auth.juliamertz.dev
            policy: bypass
          - domain: hass.juliamertz.dev
            policy: bypass
            resources:
              - '^/auth/.*$'
              - '^/api/websocket$'
              - '^/api/webhook/.*$'
          - domain: "*.juliamertz.dev"
            policy: one_factor
          - domain: "*.merlijnvoncken.*"
            policy: one_factor
    
      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt

    persistence:
      enabled: false

    secret:
      additionalSecrets:
        authelia-secrets:
          items:
            - key: SESSION_SECRET
              path: session.encryption.key
            - key: STORAGE_ENCRYPTION_KEY
              path: storage.encryption.key
        authelia-db-app:
          items:
            - key: password
              path: password
