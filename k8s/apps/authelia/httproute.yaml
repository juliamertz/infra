---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
spec:
  parentRefs:
    - name: shared
      namespace: default
  hostnames:
    - auth.juliamertz.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          port: 80

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: authelia
spec:
  targetCertificate:
    name: gateway-tls
    namespace: default
  hostnames:
    - auth.juliamertz.dev
