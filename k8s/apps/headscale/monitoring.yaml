apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: headscale
  labels:
    release: kube-prometheus-stack
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
  namespaceSelector:
    matchNames:
      - headscale
  selector:
    matchLabels:
      app.kubernetes.io/part-of: headscale
      app.kubernetes.io/component: metrics

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: headscale-db
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: headscale-db
      cnpg.io/instanceRole: replica
  podMetricsEndpoints:
  - port: metrics
