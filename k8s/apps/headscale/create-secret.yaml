apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-generate-keys
  namespace: headscale
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: headscale-key-generator
      containers:
      - name: generate-and-create-secret
        image: alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e

          apk update
          apk add kubectl headscale
          
          if kubectl get secret headscale-keys -n headscale 2>/dev/null; then
            echo "Secret already exists, skipping"
            exit 0
          fi
          
          echo "Generating random private keys..."
          
          headscale generate private-key > /tmp/noise_private.key
          headscale generate private-key > /tmp/derp_server_private.key
          
          echo "Creating secret..."
          kubectl create secret generic headscale-keys \
            --from-file=noise_private.key=/tmp/noise_private.key \
            --from-file=derp_server_private.key=/tmp/derp_server_private.key \
            -n headscale
          
          echo "Secret created"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-key-generator
  namespace: headscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-key-generator
  namespace: headscale
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-key-generator
  namespace: headscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-key-generator
subjects:
- kind: ServiceAccount
  name: headscale-key-generator
  namespace: headscale
