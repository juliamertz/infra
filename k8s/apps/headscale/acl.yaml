apiVersion: headscale.juliamertz.dev/v1alpha1
kind: Policy
metadata:
  name: central
spec:
  headscaleRef:
    name: central
  acls:
    - action: accept
      src: ['autogroup:member']
      dst: ['autogroup:self:*']
    - action: accept
      src: ['julia@']
      dst: ['*:*']
    - action: accept
      src: ['kubernetes@']
      dst: ['homelab@:8123,8096']
  # tagOwners:
  #   tag:tailscale-sidecar: []
