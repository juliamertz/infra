---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
  labels:
    app.kubernetes.io/name: headscale
    app.kubernetes.io/part-of: headscale
spec:
  selector:
    app.kubernetes.io/name: headscale
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP 
      appProtocol: kubernetes.io/wss
    - name: metrics
      port: 9090
      targetPort: 9090
