---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: headscale-central
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
      nodePort: 30443
    - name: derp
      port: 3478
      targetPort: 3478
      protocol: UDP
      nodePort: 30478

---
apiVersion: v1
kind: Service
metadata:
  name: headscale-metrics
  namespace: headscale
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headscale-central
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
