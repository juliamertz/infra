---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headscale
spec:
  parentRefs:
  - name: shared
    namespace: default
  hostnames:
  - headscale.juliamertz.nl
  rules:
  - backendRefs:
    - name: headscale
      port: 8080

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: headscale
spec:
  targetCertificate:
    name: gateway-tls
    namespace: default
  hostnames:
    - headscale.juliamertz.nl
