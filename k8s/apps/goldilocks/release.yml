apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds
spec:
  interval: 1h
  url: https://charts.fairwinds.com/stable

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: goldilocks
spec:
  interval: 5m
  chart:
    spec:
      chart: vpa
      version: "4.5.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
      interval: 5m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    recommender:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 512Mi
      extraArgs:
        storage: checkpoint
        checkpoints-gc-interval: 10m
        pod-recommendation-min-cpu-millicores: 10
        pod-recommendation-min-memory-mb: 10
    updater:
      enabled: false
    admissionController:
      enabled: false

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 5m
  chart:
    spec:
      chart: goldilocks
      version: "10.2.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: goldilocks
      interval: 5m
  values:
    dashboard:
      replicaCount: 1
      service:
        type: ClusterIP
    vpa:
      enabled: false
    controller:
      flags:
        ignore-controller-kind: "Job,CronJob,Cluster,Prometheus"
      rbac:
        extraRules:
          - apiGroups:
              - postgresql.cnpg.io
            resources:
              - clusters
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - monitoring.coreos.com
            resources:
              - prometheuses
            verbs:
              - get
              - list
              - watch
      resources:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 128Mi
