apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds
spec:
  interval: 1h
  url: https://charts.fairwinds.com/stable

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 5m
  chart:
    spec:
      chart: goldilocks
      version: "10.2.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: goldilocks
      interval: 5m
  values:
    dashboard:
      replicaCount: 1
      service:
        type: ClusterIP
    vpa:
      enabled: false
    controller:
      flags:
        ignore-controller-kind: "Job,CronJob,Cluster"
      rbac:
        extraRules:
          - apiGroups:
              - postgresql.cnpg.io
            resources:
              - clusters
            verbs:
              - get
              - list
              - watch
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
