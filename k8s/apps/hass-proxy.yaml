apiVersion: apps/v1
kind: Deployment
metadata:
  name: hass-proxy
  namespace: tailscale-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hass-proxy
  template:
    metadata:
      labels:
        app: hass-proxy
      annotations:
        headscale.juliamertz.dev/tailscale-inject-sidecar: "true"
        headscale.juliamertz.dev/tailscale-extra-args: --login-server https://headscale.juliamertz.nl:30443 --accept-routes --advertise-tags=tag:tailscale-sidecar
        headscale.juliamertz.dev/tailscale-auth-secret: tailscale-agent-auth
    spec:
      containers:
      - name: caddy
        image: caddy:latest
        command: ["sh", "-c"]
        args:
        - |
          cat <<'CADDYFILE' > /tmp/Caddyfile
          { 
              admin off
          }
          :80 {
              reverse_proxy hydra.headscale.local:8123
          }
          CADDYFILE
          caddy run --config /tmp/Caddyfile
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: hass-proxy
  namespace: tailscale-agent
spec:
  type: ClusterIP
  selector:
    app: hass-proxy
  ports:
    - name: http
      port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hass-proxy-routes-redirect
  namespace: tailscale-agent
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: default
      sectionName: http
  hostnames:
    - hass.juliamertz.dev
    - hass.juliamertz.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hass-proxy-routes
  namespace: tailscale-agent
spec:
  hostnames:
    - hass.juliamertz.dev
    - hass.juliamertz.nl
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: hass-proxy
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: hass-proxy-routes
  namespace: tailscale-agent
spec:
  hostnames:
    - hass.juliamertz.dev
    - hass.juliamertz.nl
  targetCertificate:
    name: gateway-tls
    namespace: default

