apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
  - name: shared
    namespace: default
  hostnames:
  - grafana.prod.juliamertz.dev
  - grafana.juliamertz.dev
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80

---
apiVersion: cert-vandal.io/v1
kind: SANInjection
metadata:
  name: grafana
spec:
  targetCertificate:
    name: gateway-tls
    namespace: default
  hostnames:
    - grafana.prod.juliamertz.dev
    - grafana.juliamertz.dev
