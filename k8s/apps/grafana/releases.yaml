apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 30m
  url: https://grafana.github.io/helm-charts

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 30m
  url: https://prometheus-community.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 78.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  values: 
    grafana:
      admin:
        existingSecret: kube-prometheus-stack-grafana
        passwordKey: admin-password
        userKey: admin-user
      adminPassword: ""
      adminUser: ""
      additionalDataSources:
         - name: Loki
           type: loki
           access: proxy
           url: http://loki-stack:3100
           jsonData:
             maxLines: 1000
           version: 1
           editable: true
           isDefault: false
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-local
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi
    alertmanager:
      enabled: false

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: loki-stack
      version: 2.10.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  values:
    loki:
      enabled: true
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: longhorn-local
      config:
        auth_enabled: false
        limits_config:
          retention_period: 168h
