apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 30m
  url: https://grafana.github.io/helm-charts

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
spec:
  interval: 30m
  url: https://prometheus-community.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 78.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  values: 
    kubeApiServer:
      serviceMonitor:
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'apiserver_request_(duration|body_size|sli_duration)_seconds_bucket'
          action: drop
        - sourceLabels: [__name__]
          regex: 'apiserver_response_sizes_bucket'
          action: drop
        - sourceLabels: [__name__]
          regex: 'etcd_request_duration_seconds_bucket'
          action: drop
    grafana:
      resources:
        requests:
          cpu: 25m
          memory: 200Mi
        limits:
          cpu: 100m
          memory: 512Mi
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 50m
            memory: 256Mi
      admin:
        existingSecret: kube-prometheus-stack-grafana
        passwordKey: admin-password
        userKey: admin-user
      adminPassword: ""
      adminUser: ""
      additionalDataSources:
         - name: Loki
           type: loki
           access: proxy
           url: http://loki-stack:3100
           jsonData:
             maxLines: 1000
           version: 1
           editable: true
           isDefault: false
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 256Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 256Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 15m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      prometheusSpec:
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        probeSelector: {}
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        probeNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-local
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 15Gi
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          requests:
            cpu: 15m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
      config:
        route:
          group_by: ['alertname']
          group_wait: 20s
          group_interval: 5m
          repeat_interval: 3h 
          receiver: discord_webhook

        receivers:
        - name: 'discord_webhook'
          webhook_configs:
          - url: 'http://alertmanager-discord:9094'

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
spec:
  interval: 5m
  chart:
    spec:
      chart: loki-stack
      version: 2.10.2
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1m
  values:
    loki:
      enabled: true
      resources:
        requests:
          cpu: 15m
          memory: 192Mi
        limits:
          cpu: 100m
          memory: 512Mi
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: longhorn-local
      config:
        auth_enabled: false
        limits_config:
          retention_period: 168h
    promtail:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      tolerations:
        - key: node.kubernetes.io/role
          operator: Equal
          value: gameserver-node
          effect: NoExecute
        - key: node.kubernetes.io/role
          operator: Equal
          value: autoscaler-node
          effect: NoExecute

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
spec:
  interval: 5m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.7.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1m
  values:
    fullnameOverride: blackbox-exporter
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 50m
        memory: 128Mi
    releaseLabel: true
    serviceMonitor: { enabled: true }
    replicas: 2
    podDisruptionBudget: { maxUnavailable: 1 }
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            follow_redirects: true
            preferred_ip_protocol: "ip4"
