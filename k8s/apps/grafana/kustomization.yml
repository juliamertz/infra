apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

images:
- name: alertmanager-discord
  newName: ghcr.io/rogerrum/alertmanager-discord
  newTag: 1.0.7

resources:
  - namespace.yaml
  - releases.yaml
  - httproute.yaml
  - securitypolicy.yaml
  - alertmanager-discord.yaml

configMapGenerator:
  - name: nettenshop-dashboard
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1" 
    files:
      - dashboards/nettenshop.json
  - name: headscale-dashboard
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1" 
    files:
      - dashboards/headscale.json
  - name: cloudnative-pg-dashboard
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1" 
    files:
      - dashboards/cloudnative-pg.json
