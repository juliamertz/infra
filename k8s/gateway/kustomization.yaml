apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - gateway.yaml
  - proxy-protocol.yaml
  - rate-limit.yaml
  - extension.yaml

configMapGenerator:
  - name: envoy-lua-extension
    options:
      disableNameSuffixHash: true
    files:
      - extension.lua
