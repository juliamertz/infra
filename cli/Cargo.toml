[package]
name = "infra"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "infra"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env"] }
demand = "1.7.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
version-compare = "0.2.1"
kube = { version = "2.0.1", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.26.0", features = ["v1_34", "schemars"] }
k8s-openapi-ext = { git = "https://github.com/juliamertz/k8s-openapi-ext-rs" }
tonic = "0.14.2"
serde_yaml = "0.9.34"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20" }
schemars = "1.1.0"
chrono = "0.4.42"
hcloud = "0.25.0"
json-patch = "4.1.0"
futures = "0.3.31"
