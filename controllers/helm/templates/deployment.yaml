{{ range $service := $.Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.cmd }}-controller
  labels:
    app.kubernetes.io/name: {{ $service.cmd }}-controller
    app.kubernetes.io/part-of: infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service.cmd }}-controller
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $service.cmd }}-controller
        app.kubernetes.io/part-of: infra
    spec:
      serviceAccountName: infra-controller{{if eq $service.admin true }}-admin{{ end }}
      terminationGracePeriodSeconds: 15
      imagePullSecrets:
      - name: github-registry
      {{- if $service.volumes }}
      volumes:
        {{ $service.volumes | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: infra-controller
          image: {{ $.Values.steiger.infraControllers.image }}
          {{- if $service.ports }}
          ports:
          {{ $service.ports | toYaml | nindent 12 }}
          {{ end }}
          args: 
            - /bin/infra-controllers
            - {{ $service.cmd }}
          env:
            - name: RUST_LOG
              value: "info,infra_controllers=debug"
            {{- if $service.extraEnv }}
            {{ $service.extraEnv | toYaml | nindent 12 }}
            {{ end }}
          {{- if $service.volumeMounts }}
          volumeMounts:
            {{ $service.volumeMounts | toYaml | nindent 12 }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          resources:
          {{- if $service.resources }}
            {{ $service.resources | toYaml | nindent 12 }}
          {{ else }}
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 40m
              memory: 80Mi
          {{ end }}
{{ end }}
