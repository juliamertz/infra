[package]
name = "controllers"
version = "0.1.0"
edition = "2024"

[[bin]]
name= "infra-controllers"
path = "src/main.rs"

[dependencies]
common = { workspace = true }
anyhow = { workspace = true }
kube = { workspace = true }
kubus = "0.6.0"
k8s-openapi = { workspace = true }
k8s-openapi-ext = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = "0.4"
humantime = "2"
ipnet = "2"
async-trait = "0.1"
gix = { version = "0.79.0", features = ["worktree-mutation", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
sha2 = "0.10.9"
schemars = "1"
