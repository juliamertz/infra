[package]
name = "controllers"
version = "0.1.0"
edition = "2024"

[[bin]]
name= "infra-controllers"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
kube = { version = "2.0.1", features = ["aws-lc-rs"] }
kubus = "0.5.0"
k8s-openapi = { version = "0.26.0", features = ["v1_34", "schemars"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
thiserror = "2.0.17"
schemars = "1.1.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
tracing-subscriber = "0.3.22"
chrono = "0.4.42"
humantime = "2.3.0"
ipnet = "2.10.0"
k8s-openapi-ext = "0.26.9"
