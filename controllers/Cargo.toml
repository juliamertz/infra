[package]
name = "controllers"
version = "0.1.0"
edition = "2024"

[[bin]]
name= "infra-controllers"
path = "src/main.rs"

[dependencies]
anyhow = "1"
kube = { version = "3", features = ["aws-lc-rs"] }
kubus = "0.6.0"
k8s-openapi = { version = "0.27", features = ["v1_34", "schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = "0.3"
chrono = "0.4"
humantime = "2"
ipnet = "2"
k8s-openapi-ext = "0.27"
async-trait = "0.1"
