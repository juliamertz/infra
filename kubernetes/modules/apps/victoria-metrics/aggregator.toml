data_dir = "/vector-data-dir"

[api]
enabled = true
address = "127.0.0.1:8686"
playground = false


[sources.internal_metrics]
type = "internal_metrics"

[sources.vector]
address = "0.0.0.0:6000"
type = "vector"
version = "2"


[transforms.remap]
type = "remap"
inputs = ["vector"]
source = '''
._msg = .message
'''

[sinks.prom_exporter]
type = "prometheus_exporter"
inputs = ["internal_metrics"]
address = "0.0.0.0:9090"

[sinks.stdout]
type = "console"
inputs = ["vector"]
  [sinks.stdout.encoding]
  codec = "json"

[sinks.victorialogs]
type = "elasticsearch"
inputs = ["remap"]
endpoints = ["http://victoria-logs-server:9428/insert/elasticsearch/"]
mode = "bulk"
api_version = "v8"
